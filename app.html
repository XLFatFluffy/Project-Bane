<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Bane</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>body{margin:0;background:#0b0d10;color:#f3f5f7;font:14px system-ui}main{max-width:1200px;margin:auto;padding:28px}.card{background:#11151a;border:1px solid #28303a;border-radius:12px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.btn{padding:10px 14px;border:1px solid #38424d;background:#151a20;color:#fff;border-radius:8px;cursor:pointer}.primary{background:#d9a441;color:#17120a;border-color:#d9a441;font-weight:700}.muted{color:#8d98a5}.big{font-size:28px;font-weight:800}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,textarea{background:#0b0f13;color:#fff;border:1px solid #303944;border-radius:7px;padding:8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #28303a}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}@media print{body{background:#fff;color:#111}.no-print{display:none!important}.card{border:0;box-shadow:none}}</style></head><body><main><div class="row no-print"><div><div class="muted">PROJECT BANE · 52-WEEK TRANSFORMATION</div><h1 id="title">Today</h1></div><button class="btn" id="print">Print Today's Workout</button></div><div id="app"></div><div id="printArea"></div></main><script>
const KEY='project-bane-v2';const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let S=(()=>{try{return {...{program:null,nutrition:[],sessions:{},weights:[],settings:{week:1,goalWeight:250},sources:{}},...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {program:null,nutrition:[],sessions:{},weights:[],settings:{week:1,goalWeight:250},sources:{}}}})();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toISOString().slice(0,10);const day=()=>new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(new Date());const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const data=d=>S.program?.days?.[d.toUpperCase()];const cond=d=>S.program?.conditioning?.[d.toUpperCase()];const sk=(d=day())=>today()+'|W'+S.settings.week+'|'+d;function render(){document.getElementById('app').innerHTML=page();bindPage()}function page(){let d=data(day()),c=cond(day()),w=S.weights.at(-1),n=S.nutrition.filter(x=>x.date===today()).reduce((a,x)=>({c:a.c+(+x.calories||0),p:a.p+(+x.protein||0),n:a.n+(x.netCarbs??((+x.carbs||0)- (+x.fiber||0)))}),{c:0,p:0,n:0});return `<div class="grid"><div class="card"><div class="muted">CURRENT BLOCK</div><div class="big">${esc(S.program?.block||'Block 1')}</div><div class="muted">${esc(S.program?.weeks||'Weeks 1–4')}</div></div><div class="card"><div class="muted">TODAY</div><div class="big">${esc(day())}</div><div>${esc(d?.focus||'Recovery / Review')}</div></div><div class="card"><div class="muted">WEIGHT</div><div class="big">${w?.weight??'—'} <small>lb</small></div><div class="muted">${w?.date||'Record a weigh-in'}</div></div><div class="card"><div class="muted">NUTRITION</div><div>${Math.round(n.c)} cal · ${Math.round(n.p)}g protein · ${Math.round(n.n)}g net carbs</div></div></div><div class="card"><div class="row" style="justify-content:space-between"><div><h2>${esc(d?.focus||'Recovery / Review')}</h2><div class="muted">Week ${S.settings.week} · print the sheet and train away from the app</div></div><div class="row"><button class="btn primary" id="open">Open Workout</button><button class="btn" id="print2">Print</button></div></div><div class="row">${DAYS.map(x=>`<button class="btn" data-day="${x}">${x.slice(0,3)}<br><small>${esc(data(x)?.focus||'Rest')}</small></button>`).join('')}</div></div><div class="card"><h2>Source manager</h2><p class="muted">Preview canonical workbooks before accepting them. Active program data remains unchanged until a source is accepted.</p><div class="row"><button class="btn primary" id="xlsx">Import XLSX</button><button class="btn" id="md">Import Markdown</button><button class="btn" id="sync">Sync GitHub</button><button class="btn" id="weight">Record Weight</button><input id="file" type="file" hidden></div><div id="result" style="margin-top:12px"></div></div></div>`}
function workout(d=day()){let x=data(d),c=cond(d);if(!x)return `<div class="card"><h2>${esc(d)} — Recovery / Review</h2>${c?`<p><b>Conditioning:</b> ${esc(c.cardio)}</p><p style="white-space:pre-wrap">${esc(c.core)}</p>`:''}<button class="btn" id="back">Back</button></div>`;let key=sk(d),s=S.sessions[key]||{actuals:{},notes:'',completed:false};return `<div class="card"><div class="row" style="justify-content:space-between"><div><div class="muted">${esc(S.program.block)} · Week ${S.settings.week}</div><h2>${esc(x.focus)}</h2></div><div class="row"><button class="btn" id="back">Back</button><button class="btn primary" id="complete">${s.completed?'✓ Completed':'Mark Complete'}</button><button class="btn" id="print3">Print</button></div></div><h3>Warm-up & Mobility</h3>${(S.program.warmup||[]).map(z=>`<div>□ ${esc(z)}</div>`).join('')}<h3>Strength</h3>${x.exercises.map((e,i)=>{let count=Math.min(6,Math.max(1,parseInt(String(e.sets).match(/\d+/)?.[0]||3)));let a=s.actuals?.[i]||{};return `<div class="card"><b>${esc(e.exercise||e.name)}</b><div class="muted">${esc(e.sets)} × ${esc(e.reps)} · ${esc(e.section)}</div><table><tr><th>Set</th><th>Weight</th><th>Reps</th><th>Notes</th></tr>${Array.from({length:count},(_,j)=>`<tr><td>${j+1}</td><td><input data-a="${i}:${j}:weight" value="${esc(a[j]?.weight||'')}"></td><td><input data-a="${i}:${j}:reps" value="${esc(a[j]?.reps||'')}"></td><td><input data-a="${i}:${j}:note" value="${esc(a[j]?.note||'')}"></td></tr>`).join('')}</table></div>`}).join('')}<h3>Conditioning + Core</h3><p><b>Cardio:</b> ${esc(c?.cardio||'—')}</p><p style="white-space:pre-wrap">${esc(c?.core||'—')}</p><h3>Workout Notes</h3><textarea id="notes" style="width:100%;min-height:90px">${esc(s.notes||'')}</textarea></div>`}
function bindPage(){document.getElementById('open')?.addEventListener('click',()=>{document.getElementById('app').innerHTML=workout(day());bindWorkout(day())});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{let d=b.dataset.day;document.getElementById('app').innerHTML=workout(d);bindWorkout(d)});document.getElementById('print2')?.addEventListener('click',printToday);document.getElementById('sources')?.addEventListener('click',()=>{});document.getElementById('weight')?.addEventListener('click',()=>{let v=prompt('Weight (lb)');if(v&&isFinite(+v)){S.weights.push({date:today(),weight:+v});save();render()}});document.getElementById('print')?.addEventListener('click',printToday);document.getElementById('xlsx')?.addEventListener('click',()=>pick('.xlsx,.xls'));document.getElementById('md')?.addEventListener('click',()=>pick('.md,.markdown'));document.getElementById('sync')?.addEventListener('click',sync)}function bindWorkout(d){document.getElementById('back').onclick=render;document.getElementById('print3').onclick=()=>printToday(d);let key=sk(d),s=S.sessions[key]||{actuals:{},notes:'',completed:false};document.querySelectorAll('[data-a]').forEach(i=>i.onchange=()=>{let [ei,si,f]=i.dataset.a.split(':');s.actuals[ei]=s.actuals[ei]||{};s.actuals[ei][si]=s.actuals[ei][si]||{};s.actuals[ei][si][f]=i.value;S.sessions[key]=s;save()});document.getElementById('notes').onchange=e=>{s.notes=e.target.value;S.sessions[key]=s;save()};document.getElementById('complete').onclick=()=>{s.completed=!s.completed;S.sessions[key]=s;save();bindWorkout(d)}}function pick(a){let i=document.getElementById('file');i.accept=a;i.onchange=()=>importFile(i.files[0]);i.click()}async function importFile(f){if(!f)return;let out=document.getElementById('result');if(f.name.toLowerCase().endsWith('.md')){S.sources.handoff={name:f.name,importedAt:new Date().toISOString()};save();out.innerHTML='<div class="card">Markdown source stored. Structured program data is unchanged.</div>';return}try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),names=wb.SheetNames;if(names.includes('BLOCK 1 PROGRAM')&&names.includes('CONDITIONING')){let rows=XLSX.utils.sheet_to_json(wb.Sheets['BLOCK 1 PROGRAM'],{header:1,defval:''});out.innerHTML=`<div class="card"><b>Workout source preview</b><p>${rows.length-4} summary rows detected. Sheets: ${names.join(', ')}</p><button class="btn primary" id="apply">Accept Source</button> <button class="btn" id="cancel">Cancel</button></div>`;document.getElementById('apply').onclick=()=>{S.sources.program={name:f.name,importedAt:new Date().toISOString(),sheetSignature:names.join('|')};save();out.innerHTML='<div class="card">Source accepted. The canonical normalized dataset can now be refreshed from GitHub.</div>'};document.getElementById('cancel').onclick=()=>out.innerHTML='Cancelled.'}else if(names.includes('Daily Log')){let rows=XLSX.utils.sheet_to_json(wb.Sheets['Daily Log'],{defval:''});out.innerHTML=`<div class="card"><b>Meal log preview</b><p>${rows.length} rows detected.</p><button class="btn primary" id="apply">Accept Source</button></div>`;document.getElementById('apply').onclick=()=>{S.sources.nutrition={name:f.name,importedAt:new Date().toISOString(),rows:rows.length};save();out.innerHTML='<div class="card">Meal source accepted.</div>'}}else out.innerHTML='<div class="card">Unsupported workbook structure.</div>'}catch(e){out.innerHTML='<div class="card">Import failed: '+esc(e.message)+'</div>'}}async function sync(){try{let [p,n]=await Promise.all([fetch('./data/program.json?'+Date.now()).then(r=>r.json()),fetch('./data/nutrition.json?'+Date.now()).then(r=>r.json())]);S.program=p;S.nutrition=n;S.sources.program={name:'GitHub data/program.json',importedAt:new Date().toISOString()};S.sources.nutrition={name:'GitHub data/nutrition.json',importedAt:new Date().toISOString()};save();render()}catch(e){document.getElementById('result').innerHTML='<div class="card">Sync failed: '+esc(e.message)+'</div>'}}function printToday(d=day()){let x=data(d),c=cond(d);if(!x)return;let h=`<div style="font-family:Arial;color:#111"><h1>PROJECT BANE — ${esc(d)}</h1><p>${esc(S.program.block)} · Week ${S.settings.week} · ${new Date().toLocaleDateString()}</p><h2>WARM-UP & MOBILITY</h2>${(S.program.warmup||[]).map(z=>`<div>□ ${esc(z)}</div>`).join('')}<h2>${esc(x.focus)}</h2>`;x.exercises.forEach(e=>{let count=Math.min(6,Math.max(1,parseInt(String(e.sets).match(/\d+/)?.[0]||3)));h+=`<b>${esc(e.exercise||e.name)} — ${esc(e.sets)} × ${esc(e.reps)}</b><table border="1" cellspacing="0" cellpadding="5" width="100%"><tr><th>Set</th><th>Weight</th><th>Reps</th><th>Notes</th></tr>${Array.from({length:count},(_,i)=>`<tr><td>${i+1}</td><td style="height:24px"></td><td></td><td></td></tr>`).join('')}</table>`});if(c)h+=`<h2>CONDITIONING + CORE</h2><p><b>Cardio:</b> ${esc(c.cardio)}</p><p style="white-space:pre-wrap">${esc(c.core)}</p><h2>WORKOUT NOTES</h2><div style="height:100px;border:1px solid #777"></div></div>`;let w=open('', '_blank');w.document.write(h);w.document.close();w.focus();w.print()}async function boot(){try{if(!S.program)S.program=await fetch('./data/program.json').then(r=>r.json());if(!S.nutrition)S.nutrition=await fetch('./data/nutrition.json').then(r=>r.json())}catch(e){}render()}boot();
</script></main></body></html>
