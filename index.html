<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Bane</title><meta name="description" content="Project Bane training, nutrition and progress command center.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
<div class="brand"><div class="brand-mark">B</div><div><strong>PROJECT BANE</strong><span>Training System</span></div></div>
<nav>
<button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
<button class="nav-item" data-view="today">▣ <span>Today</span></button>
<button class="nav-item" data-view="progress">↗ <span>Progress</span></button>
<button class="nav-item" data-view="nutrition">◉ <span>Nutrition</span></button>
<button class="nav-item" data-view="history">▤ <span>History</span></button>
<button class="nav-item" data-view="sources">↻ <span>Sources</span></button>
</nav>
<div class="sidebar-footer"><span id="syncDot" class="sync-dot"></span><span id="sourceStatus">Local source loaded</span></div>
</aside>
<main class="main">
<header class="topbar"><div><p class="eyebrow" id="eyebrow"></p><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button class="ghost" id="printBtn">Print Today</button></div></header>
<section id="view"></section>
</main></div>
<div id="toast" class="toast"></div>
<input id="fileInput" type="file" accept=".xlsx,.xls,.json,.md,.txt" hidden>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body></html>
