<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1400">
<title>Project Bane</title>
<meta name="description" content="Project Bane daily training, nutrition and progress command center.">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.full.min.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="builder.css">
<style>
#bane-food-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;display:none;padding:5vh 7vw;overflow:auto}#bane-food-overlay.open{display:block}.food-modal{max-width:1100px;margin:auto;background:#12171d;color:#f0f3f6;border:1px solid #28313b;border-radius:18px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.55)}.food-head{display:flex;justify-content:space-between;align-items:center}.food-head small{color:#8e99a7}.food-head h2{margin:4px 0 12px;color:#f0f3f6}.food-modal p{color:#8e99a7}.food-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;max-height:58vh;overflow:auto;padding-right:4px}.food-card{display:flex;justify-content:space-between;text-align:left;align-items:center;padding:16px;border:1px solid #28313b;border-radius:12px;background:#171d24;color:#f0f3f6;cursor:pointer}.food-card:hover{border-color:#697683;transform:translateY(-1px)}.food-card b{color:#f0f3f6}.food-card span{display:block;font-size:12px;color:#8e99a7;margin-top:4px}.food-card strong{font-size:12px;color:#b9c2cb;margin-left:15px;white-space:nowrap}.food-actions{display:flex;gap:10px;margin-top:18px}.food-editor{margin-top:20px;padding:18px;background:#171d24;border:1px solid #28313b;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.food-editor h3,.food-editor button{grid-column:1/-1;color:#f0f3f6}.food-modal input,.food-modal select{padding:11px;border:1px solid #28313b;border-radius:8px;background:#0d1116;color:#f0f3f6}.food-modal #food-search{width:100%;margin-top:10px}.food-modal button{padding:10px 14px;border:1px solid #28313b;border-radius:8px;background:#171d24;color:#f0f3f6;cursor:pointer}.food-modal button.primary{background:#dfe5ea;color:#11171d;border-color:#dfe5ea}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="boot-data.mjs"></script>
<script type="module" src="bane-app.mjs"></script>
<script type="module" src="program-builder-ui.js"></script>
<script type="module" src="food-library-ui.mjs"></script>
</body>
</html>
