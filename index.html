<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Bane</title>
<meta name="description" content="Project Bane daily training, nutrition and progress system.">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#11151a;--panel2:#171c22;--line:#28303a;--text:#f3f5f7;--muted:#8d98a5;--accent:#d9a441;--good:#61c48a;--danger:#df6f6f;--shadow:0 14px 40px #0005}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
.sidebar{position:sticky;top:0;height:100vh;background:#0d1014;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;margin:4px 8px 28px}.mark{width:40px;height:40px;border:1px solid #444;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:20px;background:#171b20}.brand b{display:block;letter-spacing:.12em;font-size:13px}.brand small{display:block;color:var(--muted);margin-top:2px;font-size:9px;letter-spacing:.08em}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aab2bc;text-align:left;padding:11px 12px;border-radius:9px}.nav button:hover{background:#171b20;color:#fff}.nav button.active{background:#1d2229;color:#fff;box-shadow:inset 3px 0 var(--accent)}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:15px;display:grid;gap:8px}.side-bottom button{background:#151a20;border:1px solid var(--line);color:#cbd2da;padding:9px;border-radius:8px}
main{min-width:0;padding:30px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.top h1{margin:4px 0 0;font-size:30px;letter-spacing:-.02em}
.btn{border:1px solid var(--line);background:#151a20;color:#e9edf1;padding:10px 14px;border-radius:8px}.btn:hover{border-color:#4a5562}.btn.primary{background:var(--accent);border-color:var(--accent);color:#17120a;font-weight:800}.btn.good{background:#173522;border-color:#2e6d48;color:#bff1d0}.btn.danger{background:#351919;border-color:#713333;color:#ffcaca}
.grid{display:grid;gap:14px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}
.card{background:linear-gradient(180deg,var(--panel),#101419);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.card h2{font-size:19px}.card h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em}.label{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.big{font-size:29px;font-weight:800;margin-top:6px}.big small{font-size:13px;color:var(--muted);font-weight:600}.muted{color:var(--muted)}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:14px}.actions,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stat{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}.stat b{font-size:21px}.stat span{color:var(--muted)}
.day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.daybox{padding:10px;border:1px solid var(--line);border-radius:8px;background:#12171c}.daybox strong{display:block}.daybox small{color:var(--muted);display:block;margin-top:4px}.daybox.today{border-color:var(--accent)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:10px;color:var(--muted);letter-spacing:.05em}
.section-title{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.exercise{border-top:1px solid var(--line);padding:16px 0}.exercise:first-child{border-top:0}.exercise-head{display:flex;justify-content:space-between;gap:15px}.exercise-name{font-size:15px;font-weight:750}.prescription{color:var(--muted);font-size:12px;margin-top:3px}.setgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.set{border:1px solid var(--line);border-radius:8px;padding:8px;background:#0e1216}.set label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.set input,.log input,.log textarea,textarea,select{width:100%;background:#0b0f13;border:1px solid #303944;color:#fff;border-radius:7px;padding:8px;outline:0}.set input:focus,input:focus,textarea:focus,select:focus{border-color:#687484}.notes{min-height:70px;resize:vertical}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.history-row,.source-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.history-row:last-child,.source-row:last-child{border:0}
.notice{border:1px solid #765f29;background:#2a2415;color:#e8d39a;border-radius:9px;padding:12px}.success{border:1px solid #2c6946;background:#13291d;color:#bceccc;border-radius:9px;padding:12px}.error{border:1px solid #713737;background:#2b1616;color:#ffc8c8;border-radius:9px;padding:12px}.file-drop{border:1px dashed #4b5662;padding:28px;border-radius:10px;text-align:center;background:#0e1216}.chart{height:210px;width:100%;display:block}.chart text{fill:var(--muted);font-size:10px}.chart polyline{fill:none;stroke:var(--accent);stroke-width:3}.chart circle{fill:var(--accent)}
@media(max-width:1000px){.app{grid-template-columns:76px 1fr}.sidebar{padding:15px 10px}.brand div:not(.mark),.nav span,.side-bottom{display:none}.brand{margin:4px auto 25px}.nav button{text-align:center}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.setgrid{grid-template-columns:repeat(3,1fr)}main{padding:20px}}
@media(max-width:650px){.app{display:block}.sidebar{height:auto;position:static;display:block;padding:8px}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid4,.grid2{grid-template-columns:1fr}.day-strip{grid-template-columns:repeat(4,1fr)}.setgrid{grid-template-columns:repeat(2,1fr)}main{padding:14px}.hero{display:block}.hero .actions{margin-top:15px}}
@media print{body{background:#fff;color:#111}.app{display:block}.sidebar,.no-print{display:none!important}main{padding:0;max-width:none}.print-sheet{display:block}.screen-only{display:none!important}.print-page{font:12px/1.3 Arial,sans-serif;color:#111}.print-page h1{font-size:22px;margin:0}.print-page h2{font-size:15px;margin:18px 0 7px;border-bottom:2px solid #111;padding-bottom:3px}.print-page .meta{margin:4px 0 12px}.print-page table{border-collapse:collapse;width:100%;margin-bottom:8px}.print-page th,.print-page td{border:1px solid #999;padding:5px}.print-page th{color:#111;background:#eee}.print-page .blank{height:27px}.print-page .notes{height:55px}.print-page .exercise-title{font-weight:bold;margin:8px 0 3px}.print-page .pagebreak{page-break-before:always}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar no-print"><div class="brand"><div class="mark">B</div><div><b>PROJECT BANE</b><small>52-WEEK TRANSFORMATION</small></div></div>
<nav class="nav"><button data-page="dashboard">⌂ <span>Today</span></button><button data-page="workout">▣ <span>Workout</span></button><button data-page="food">◉ <span>Food</span></button><button data-page="progress">↗ <span>Progress</span></button><button data-page="history">▤ <span>History</span></button><button data-page="sources">↻ <span>Sources</span></button><button data-page="settings">⚙ <span>Settings</span></button></nav>
<div class="side-bottom"><button id="exportBtn">Export Backup</button><button id="importBackupBtn">Import Backup</button><input id="backupFile" type="file" accept=".json" hidden></div></aside>
<main><div class="top no-print"><div><div id="dateLabel" class="eyebrow"></div><h1 id="pageTitle"></h1></div><div class="actions"><button class="btn" id="printBtn">Print Today's Workout</button></div></div><div id="app"></div><div id="printArea" class="print-sheet"></div></main>
</div>
<script>
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],KEY="project-bane-real-v1";
const DEFAULTS={page:"dashboard",week:1,programStart:"",selectedDay:"",program:null,nutrition:null,sessions:{},weights:[],sources:{},settings:{goalWeight:250}};
let state=load();function load(){try{return {...DEFAULTS,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return {...DEFAULTS}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));function today(){return new Date().toISOString().slice(0,10)}function todayName(){return new Intl.DateTimeFormat("en-US",{weekday:"long"}).format(new Date())}function dayKey(d){return d.toUpperCase()}function currentDay(){return state.selectedDay||todayName()}function program(){return state.program}function nutrition(){return state.nutrition||[]}function sessionKey(date=today(),week=state.week,day=currentDay()){return `${date}|W${week}|${day}`}function getSession(key=sessionKey()){return state.sessions[key]||{completed:false,actuals:{},notes:""}}function setSession(key,s){state.sessions[key]=s;save()}function num(v){const n=Number(v);return Number.isFinite(n)?n:null}function dayData(day=currentDay()){return program()?.days?.[dayKey(day)]}function condData(day=currentDay()){return program()?.conditioning?.[dayKey(day)]}
function totals(date=today()){return nutrition().filter(x=>x.date===date).reduce((a,x)=>({cal:a.cal+(num(x.calories)||0),protein:a.protein+(num(x.protein)||0),carbs:a.carbs+(num(x.carbs)||0),fiber:a.fiber+(num(x.fiber)||0),net:a.net+(num(x.netCarbs)??((num(x.carbs)||0)-(num(x.fiber)||0)))}),{cal:0,protein:0,carbs:0,fiber:0,net:0})}
function weekForDate(date=today()){if(!state.programStart)return state.week||1;const a=new Date(state.programStart+"T00:00:00"),b=new Date(date+"T00:00:00");return Math.max(1,Math.min(52,Math.floor((b-a)/86400000/7)+1))}function pageTitle(){return {dashboard:"Today",workout:"Workout",food:"Food",progress:"Progress",history:"History",sources:"Sources",settings:"Settings"}[state.page]||"Today"}
function render(){document.querySelector("#dateLabel").textContent=new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}).format(new Date()).toUpperCase();document.querySelector("#pageTitle").textContent=pageTitle();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));document.querySelector("#app").innerHTML={dashboard:dashboardPage,workout:workoutPage,food:foodPage,progress:progressPage,history:historyPage,sources:sourcesPage,settings:settingsPage}[state.page]();bind()}
function dashboardPage(){const d=dayData(todayName()),c=condData(todayName()),n=totals(),s=state.sessions[sessionKey(today(),weekForDate(),todayName())],recent=state.weights.slice(-2),delta=recent.length>1?(recent[recent.length-1].weight-recent[recent.length-2].weight).toFixed(1):null;return `<div class="grid grid4"><div class="card"><div class="label">CURRENT BLOCK</div><div class="big">${esc(program()?.block||"Block 1")}</div><div class="muted">${esc(program()?.weeks||"Weeks 1–4")}</div></div><div class="card"><div class="label">TODAY</div><div class="big">${esc(todayName())}</div><div class="muted">${esc(d?.focus||"Recovery / review")}</div></div><div class="card"><div class="label">WEIGHT</div><div class="big">${state.weights.at(-1)?.weight??"—"} <small>lb</small></div><div class="muted">${delta?`${delta>0?"+":""}${delta} lb since prior`:"Record a weigh-in"}</div></div><div class="card"><div class="label">WORKOUT</div><div class="big">${s?.completed?"DONE":"OPEN"}</div><div class="muted">${c?.cardio?esc(c.cardio):"No programmed conditioning"}</div></div></div><div class="card" style="margin-top:14px"><div class="hero"><div><div class="label">TODAY'S PLAN · WEEK ${weekForDate()}</div><h2>${esc(d?.focus||"Recovery / Weekly Review")}</h2><p class="muted">${d?"Your paper sheet is the workout interface. Print it, train, then enter actuals later.":"Use today for recovery and weekly review."}</p></div><div class="actions"><button class="btn primary" data-page="workout">Open Today</button><button class="btn" id="dashPrint">Print Sheet</button></div></div><div class="day-strip">${DAYS.map(x=>{const dd=dayData(x),ss=state.sessions[sessionKey(today(),weekForDate(),x)];return `<div class="daybox ${x===todayName()?"today":""}"><strong>${x.slice(0,3)}</strong><small>${esc(dd?.focus||"Rest")}</small>${ss?.completed?'<span class="pill">DONE</span>':""}</div>`}).join("")}</div></div><div class="grid grid3" style="margin-top:14px"><div class="card"><div class="label">TODAY'S NUTRITION</div><div class="stat"><b>${Math.round(n.cal)}</b><span>calories</span></div><div class="stat"><b>${Math.round(n.protein)}g</b><span>protein</span></div><div class="stat"><b>${Math.round(n.net)}g</b><span>net carbs</span></div></div><div class="card"><div class="label">YEAR GOAL</div><div class="big">${state.settings.goalWeight} <small>lb</small></div><div class="muted">Target weight</div></div><div class="card"><div class="label">SOURCE HEALTH</div><div class="big">${Object.keys(state.sources).length}</div><div class="muted">${program()?.source?.warnings?.length||0} source warning(s)</div></div></div>`}
function workoutPage(){const day=currentDay(),d=dayData(day),c=condData(day),s=getSession(sessionKey(today(),weekForDate(),day));if(!d)return `<div class="card"><h2>${esc(day)} — Recovery / Review</h2><p class="muted">No strength workout is scheduled in the current canonical program.</p>${c?conditioningCard(c):""}</div>`;const groups=[];d.exercises.forEach((e,i)=>{const prev=groups.at(-1);if(prev&&prev.section===e.section&&e.section.startsWith("SUPERSET"))prev.items.push({...e,index:i});else groups.push({section:e.section,items:[{...e,index:i}]})});return `<div class="card hero no-print"><div><div class="label">${esc(program().block)} · WEEK ${weekForDate()}</div><h2>${esc(d.focus)}</h2><p class="muted">Print before training. Actual performance is recorded afterward.</p></div><div class="actions"><button class="btn primary" id="printWorkout">Print Today's Workout</button><button class="btn good" id="completeWorkout">${s.completed?"✓ Completed":"Mark Complete"}</button></div></div><div class="card"><h3>Warm-up & Mobility</h3>${(program().warmup||[]).map(x=>`<div style="padding:6px 0">□ ${esc(x)}</div>`).join("")}</div><div class="card"><div class="section-title"><h3>Strength</h3><span class="muted">${groups.length} blocks</span></div>${groups.map(g=>groupDisplay(g,s)).join("")}</div>${c?conditioningCard(c):""}<div class="card"><h3>Workout Notes</h3><textarea class="notes" id="dayNotes" placeholder="What happened? What should change next time?">${esc(s.notes)}</textarea><div class="actions no-print" style="margin-top:8px"><button class="btn" id="saveNotes">Save Notes</button></div></div>`}
function groupDisplay(g,s){const title=g.section==="PRIMARY"?"Primary":g.section==="FINISHER"?"Finishers":g.section.replace("SUPERSET ","Superset ");return `<div class="exercise"><div class="exercise-head"><div><div class="exercise-name">${esc(title)}${g.items.length>1?` <span class="pill">${g.items.map(x=>esc(x.name)).join(" + ")}</span>`:""}</div></div></div>${g.items.map(e=>exerciseInputs(e,s)).join("")}</div>`}
function exerciseInputs(e,s){let sets=e.sets;let count=parseInt(String(sets).match(/\d+/)?.[0]||"3",10);count=Math.min(6,Math.max(1,count));const actual=s.actuals?.[e.index]||{};return `<div style="margin-top:10px"><div class="prescription"><b>${esc(e.name)}</b> · ${esc(String(e.sets))} sets · ${esc(e.reps)} reps</div><div class="setgrid">${Array.from({length:count},(_,i)=>{const a=actual[i]||{};return `<div class="set"><label>SET ${i+1}</label><input data-field="${e.index}:${i}:weight" value="${esc(a.weight||"")}" placeholder="lb"><div style="height:5px"></div><input data-field="${e.index}:${i}:reps" value="${esc(a.reps||"")}" placeholder="reps"><div style="height:5px"></div><input data-field="${e.index}:${i}:note" value="${esc(a.note||"")}" placeholder="note"></div>`}).join("")}</div></div>`}
function conditioningCard(c){return `<div class="card"><h3>Conditioning + Core</h3><p><b>Cardio:</b> ${esc(c.cardio)}</p><p><b>Core emphasis:</b> ${esc(c.emphasis)}</p><p style="white-space:pre-wrap">${esc(c.core)}</p><p class="muted">${esc(c.notes)}</p></div>`}
function foodPage(){const dates=[...new Set(nutrition().map(x=>x.date))].sort().reverse(),n=totals();return `<div class="grid grid4"><div class="card"><div class="label">CALORIES</div><div class="big">${Math.round(n.cal)}</div><div class="muted">Today</div></div><div class="card"><div class="label">PROTEIN</div><div class="big">${Math.round(n.protein)}<small> g</small></div><div class="muted">Today</div></div><div class="card"><div class="label">NET CARBS</div><div class="big">${Math.round(n.net)}<small> g</small></div><div class="muted">Today</div></div><div class="card"><div class="label">DAYS LOGGED</div><div class="big">${dates.length}</div><div class="muted">Canonical meal data</div></div></div><div class="card" style="margin-top:14px"><div class="section-title"><div><h2>Food History</h2><p class="muted">Nutrition is imported from the canonical meal log; net carbs are carbs minus fiber when not explicitly supplied.</p></div></div><table><thead><tr><th>Date</th><th>Meal</th><th>Food</th><th>Serving</th><th>Calories</th><th>Protein</th><th>Net Carbs</th></tr></thead><tbody>${nutrition().slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.meal)}</td><td>${esc(x.food)}</td><td>${esc(x.quantity)}</td><td>${x.calories??"—"}</td><td>${x.protein??"—"}g</td><td>${x.netCarbs??"—"}g</td></tr>`).join("")||`<tr><td colspan="7" class="muted">No meal data loaded.</td></tr>`}</tbody></table></div>`}
function progressPage(){const w=state.weights,latest=w.at(-1)?.weight,goal=state.settings.goalWeight,min=Math.min(...w.map(x=>x.weight),goal||250,latest||300),max=Math.max(...w.map(x=>x.weight),latest||300),pts=w.map((x,i)=>{const xp=w.length===1?50:(i/(w.length-1))*94+3,yp=8+((x.weight-min)/(max-min||1))*82;return `${xp},${yp}`}).join(" ");return `<div class="grid grid3"><div class="card"><div class="label">CURRENT</div><div class="big">${latest??"—"} <small>lb</small></div></div><div class="card"><div class="label">GOAL</div><div class="big">${goal} <small>lb</small></div></div><div class="card"><div class="label">TO GO</div><div class="big">${latest?Math.max(0,latest-goal).toFixed(1):"—"} <small>lb</small></div></div></div><div class="card" style="margin-top:14px"><div class="section-title"><h2>Weight Trend</h2><div class="actions"><input id="weightInput" type="number" step=".1" placeholder="Weight lb" style="width:130px"><button class="btn primary" id="recordWeight">Record</button></div></div>${w.length?`<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts}"></polyline>${w.map((x,i)=>{const xp=w.length===1?50:(i/(w.length-1))*94+3,yp=8+((x.weight-min)/(max-min||1))*82;return `<circle cx="${xp}" cy="${yp}" r="1.7"></circle>`}).join("")}</svg>`:`<p class="muted">Record your first weigh-in to start the trend.</p>`}</div><div class="card" style="margin-top:14px"><h3>Weigh-ins</h3><table><thead><tr><th>Date</th><th>Weight</th><th>Change</th></tr></thead><tbody>${w.slice().reverse().map((x,i,a)=>`<tr><td>${esc(x.date)}</td><td>${x.weight} lb</td><td>${i<a.length-1?((x.weight-a[i+1].weight>0?"+":"")+(x.weight-a[i+1].weight).toFixed(1)):"—"} lb</td></tr>`).join("")||`<tr><td colspan="3" class="muted">No weigh-ins.</td></tr>`}</tbody></table></div>`}
function historyPage(){const rows=Object.entries(state.sessions).sort((a,b)=>b[0].localeCompare(a[0]));return `<div class="card"><h2>Workout History</h2><p class="muted">Prescriptions are retained separately from actual performance.</p>${rows.map(([k,s])=>`<div class="history-row"><div><b>${esc(k.split("|")[2]||"Workout")}</b><div class="muted">${esc(k.split("|")[0])} · ${esc(k.split("|")[1])} · ${esc(s.focus||"")}</div></div><span class="pill">${s.completed?"COMPLETED":"LOGGED"}</span></div>`).join("")||`<p class="muted">No sessions logged yet.</p>`}</div>`}
function sourcesPage(){const warnings=program()?.source?.warnings||[];return `<div class="grid grid2"><div class="card"><h2>Canonical Sources</h2><p class="muted">GitHub is the long-term source. Manual upload is the fallback. Imports replace only the matching source domain and never delete workout history.</p>${["program","nutrition","handoff"].map(k=>`<div class="source-row"><div><b>${k==="program"?"Workout Program":k==="nutrition"?"Meal Log":"Workout System Handoff"}</b><div class="muted">${esc(state.sources[k]?.name||"Bundled source")}</div></div><span class="pill">${state.sources[k]?.importedAt?"IMPORTED":"BUNDLED"}</span></div>`).join("")}</div><div class="card"><h2>Source Health</h2>${warnings.map(w=>`<div class="notice" style="margin-bottom:8px">${esc(w)}</div>`).join("")||`<div class="success">No source warnings recorded.</div>`}</div></div><div class="card" style="margin-top:14px"><h2>Import / Sync</h2><div class="actions no-print"><button class="btn primary" id="importXlsx">Import XLSX</button><button class="btn" id="importMd">Import Markdown</button><button class="btn" id="syncGithub">Sync Bundled GitHub Data</button></div><input id="sourceFile" type="file" hidden accept=".xlsx,.xls,.md,.markdown"><div id="sourceResult" style="margin-top:12px"></div><div class="file-drop" style="margin-top:12px">Drop a canonical workbook or handoff file here, or use the buttons above.</div></div>`}
function settingsPage(){return `<div class="grid grid2"><div class="card"><h2>Program Settings</h2><p class="muted">The current source says Block 1 covers Weeks 1–4, but it does not specify a calendar start date. Set it here when the actual program start is known.</p><div class="log"><label>Program start date</label><input id="programStart" type="date" value="${esc(state.programStart)}"></div><div class="log" style="margin-top:10px"><label>Current week (used until start date is set)</label><input id="currentWeek" type="number" min="1" max="52" value="${state.week}"></div><div class="log" style="margin-top:10px"><label>Goal weight</label><input id="goalWeight" type="number" step=".1" value="${state.settings.goalWeight}"></div><button class="btn primary" id="saveSettings" style="margin-top:12px">Save Settings</button></div><div class="card"><h2>Data</h2><p class="muted">Daily records are stored locally in this browser. Export a backup before changing devices or clearing browser data.</p><button class="btn" id="settingsExport">Export Backup</button></div></div>`}
function bind(){document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.selectedDay="";save();render()});document.querySelector("#printBtn")?.addEventListener("click",printToday);document.querySelector("#dashPrint")?.addEventListener("click",printToday);document.querySelector("#printWorkout")?.addEventListener("click",printToday);document.querySelector("#completeWorkout")?.addEventListener("click",()=>{const k=sessionKey(today(),weekForDate(),currentDay()),s=getSession(k);s.completed=!s.completed;s.focus=dayData(currentDay())?.focus;setSession(k,s);render()});document.querySelectorAll("[data-field]").forEach(inp=>inp.addEventListener("change",()=>{const [ei,si,f]=inp.dataset.field.split(":");const k=sessionKey(today(),weekForDate(),currentDay()),s=getSession(k);s.actuals=s.actuals||{};s.actuals[ei]=s.actuals[ei]||{};s.actuals[ei][si]=s.actuals[ei][si]||{};s.actuals[ei][si][f]=inp.value;s.focus=dayData(currentDay())?.focus;setSession(k,s)}));document.querySelector("#dayNotes")?.addEventListener("change",()=>{const k=sessionKey(today(),weekForDate(),currentDay()),s=getSession(k);s.notes=document.querySelector("#dayNotes").value;setSession(k,s)});document.querySelector("#saveNotes")?.addEventListener("click",()=>{const k=sessionKey(today(),weekForDate(),currentDay()),s=getSession(k);s.notes=document.querySelector("#dayNotes").value;setSession(k,s);alert("Notes saved.")});document.querySelector("#recordWeight")?.addEventListener("click",()=>{const v=num(document.querySelector("#weightInput").value);if(v){state.weights.push({date:today(),weight:v});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}});document.querySelector("#importXlsx")?.addEventListener("click",()=>chooseFile(".xlsx,.xls"));document.querySelector("#importMd")?.addEventListener("click",()=>chooseFile(".md,.markdown"));document.querySelector("#syncGithub")?.addEventListener("click",syncGithub);document.querySelector("#saveSettings")?.addEventListener("click",()=>{state.programStart=document.querySelector("#programStart").value;state.week=Math.max(1,Math.min(52,num(document.querySelector("#currentWeek").value)||1));state.settings.goalWeight=num(document.querySelector("#goalWeight").value)||250;save();render()});document.querySelector("#settingsExport")?.addEventListener("click",exportBackup);document.querySelector("#exportBtn")?.addEventListener("click",exportBackup);document.querySelector("#importBackupBtn")?.addEventListener("click",()=>document.querySelector("#backupFile").click());document.querySelector("#backupFile")?.addEventListener("change",e=>importBackup(e.target.files[0]))}
function chooseFile(accept){const i=document.querySelector("#sourceFile");i.accept=accept;i.value="";i.click();i.onchange=()=>importSource(i.files[0])}
async function importSource(file){if(!file)return;const out=document.querySelector("#sourceResult");out.innerHTML='<div class="notice">Reading source…</div>';try{if(file.name.toLowerCase().endsWith(".md")){state.sources.handoff={name:file.name,importedAt:new Date().toISOString(),content:await file.text()};save();out.innerHTML='<div class="success">Workout System Handoff imported and stored. It does not silently alter the structured program.</div>';render();return}const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true}),names=wb.SheetNames;if(names.includes("BLOCK 1 PROGRAM")&&names.includes("CONDITIONING")){state.program=parseWorkoutWorkbook(wb,file.name);state.sources.program={name:file.name,importedAt:new Date().toISOString()};save();out.innerHTML='<div class="success">Workout program imported. Source health was recalculated from the workbook.</div>';render()}else if(names.includes("Daily Log")){state.nutrition=parseMealWorkbook(wb);state.sources.nutrition={name:file.name,importedAt:new Date().toISOString()};save();out.innerHTML='<div class="success">Meal log imported.</div>';render()}else throw new Error("This workbook does not match a supported Project Bane canonical format.")}catch(e){out.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function rowsOf(wb,name){return XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:"",raw:true})}
function parseWorkoutWorkbook(wb,fileName){const sum=rowsOf(wb,"BLOCK 1 PROGRAM"),h=sum[3]||[],ix=n=>h.findIndex(x=>String(x).trim().toUpperCase()===n.toUpperCase()),days={};for(let r=4;r<sum.length;r++){if(!sum[r][ix("DAY")])continue;const day=String(sum[r][ix("DAY")]).toUpperCase(),ex=[];for(const [col,sec] of [["PRIMARY","PRIMARY"],["SUPERSET 1","SUPERSET 1"],["SUPERSET 2","SUPERSET 2"],["SUPERSET 3","SUPERSET 3"],["FINISHERS","FINISHER"]]){const v=sum[r][ix(col)];String(v||"").split(/\n+/).filter(Boolean).forEach(line=>{const m=String(line).match(/^(.*?)\s+[—-]\s+(\d+(?:[–-]\d+)?|Hard sets|Rounds)\s*[×x]\s*(.+)$/i);ex.push(m?{name:m[1].trim(),sets:m[2],reps:m[3].trim(),section:sec}:{name:String(line).trim(),sets:null,reps:"",section:sec})})}days[day]={focus:String(sum[r][ix("FOCUS")]),exercises:ex}}const cr=rowsOf(wb,"CONDITIONING"),ch=cr[3]||[],ci=n=>ch.findIndex(x=>String(x).trim().toUpperCase()===n.toUpperCase()),conditioning={};for(let r=4;r<cr.length;r++){if(!cr[r][ci("DAY")])continue;const d=String(cr[r][ci("DAY")]).toUpperCase();conditioning[d]={cardio:String(cr[r][ci("CARDIO / CONDITIONING")]||""),emphasis:String(cr[r][ci("CORE EMPHASIS")]||""),core:String(cr[r][ci("CORE WORKOUT")]||""),intent:String(cr[r][ci("INTENT")]||""),notes:String(cr[r][ci("NOTES / TRACKING")]||"")}}const warnings=[];if(wb.Sheets.Wednesday){const wr=rowsOf(wb,"Wednesday"),rr=wr.find(r=>String(r[1]).trim()==="Upright Row");if(rr&&rr[3]&&String(rr[3]).includes("2026"))warnings.push("Wednesday detail sheet contains a date-formatted Rep Range for Upright Row. The BLOCK 1 PROGRAM summary is used as the active program.")}return {name:"Project Bane",block:"Block 1",weeks:"Weeks 1–4",days,conditioning,warmup:state.program?.warmup||["5–10 min easy walking / movement","Dynamic hip, shoulder, and thoracic mobility","1–2 light ramp-up sets before the first primary lift"],source:{file:fileName,updated:new Date().toISOString().slice(0,10),basis:"BLOCK 1 PROGRAM + CONDITIONING",warnings}}}
function parseMealWorkbook(wb){const r=rowsOf(wb,"Daily Log"),h=r[0]||[],ix=n=>h.findIndex(x=>String(x).trim().toLowerCase()===n.toLowerCase());return r.slice(1).filter(x=>x[ix("Date")]&&x[ix("Food / Drink")]).map(x=>{const c=num(x[ix("Total Carbs (g)")]),f=num(x[ix("Fiber (g)")]),n=num(x[ix("Net Carbs (g)")]);let d=x[ix("Date")];if(d instanceof Date)d=d.toISOString().slice(0,10);return {date:String(d).slice(0,10),meal:String(x[ix("Meal")]||"Meal"),food:String(x[ix("Food / Drink")]),quantity:String(x[ix("Quantity / Serving")]||""),calories:num(x[ix("Calories")]),protein:num(x[ix("Protein (g)")]),carbs:c,fiber:f,netCarbs:n??(c!=null&&f!=null?c-f:null),notes:String(x[ix("Notes")]||"")}})}
async function syncGithub(){const out=document.querySelector("#sourceResult");out.innerHTML='<div class="notice">Syncing bundled GitHub data…</div>';try{const [p,n]=await Promise.all([fetch("./data/program.json?"+Date.now()).then(r=>r.json()),fetch("./data/nutrition.json?"+Date.now()).then(r=>r.json())]);state.program=p;state.nutrition=n;state.sources.program={name:"GitHub: data/program.json",importedAt:new Date().toISOString()};state.sources.nutrition={name:"GitHub: data/nutrition.json",importedAt:new Date().toISOString()};save();render()}catch(e){out.innerHTML=`<div class="error">GitHub sync failed: ${esc(e.message)}</div>`}}
function printToday(){const day=todayName(),d=dayData(day),c=condData(day),week=weekForDate(),s=getSession(sessionKey(today(),week,day));let html=`<div class="print-page"><h1>PROJECT BANE — ${esc(day)}</h1><div class="meta"><b>${esc(program()?.block||"Block 1")} · Week ${week}</b> · ${new Date().toLocaleDateString()}</div>`;if(!d){html+=`<h2>RECOVERY / REVIEW</h2><p>No strength workout is scheduled in the current canonical program.</p>`}else{html+=`<h2>WARM-UP & MOBILITY</h2>${(program()?.warmup||[]).map(x=>`<div>□ ${esc(x)}</div>`).join("")}<h2>${esc(d.focus)}</h2>`;const groups=[];d.exercises.forEach((e,i)=>{const p=groups.at(-1);if(p&&p.section===e.section&&e.section.startsWith("SUPERSET"))p.items.push({...e,index:i});else groups.push({section:e.section,items:[{...e,index:i}]})});groups.forEach(g=>{html+=`<div class="exercise-title">${esc(g.section==="PRIMARY"?"PRIMARY":g.section==="FINISHER"?"FINISHERS":g.section)}</div>`;g.items.forEach(e=>{let count=Math.min(6,Math.max(1,parseInt(String(e.sets).match(/\d+/)?.[0]||"3")));html+=`<div><b>${esc(e.name)}</b> — ${esc(String(e.sets))} × ${esc(e.reps)}</div><table><tr><th>Set</th><th>Weight</th><th>Reps</th><th>Notes</th></tr>${Array.from({length:count},(_,i)=>`<tr><td>${i+1}</td><td class="blank">${esc(s.actuals?.[e.index]?.[i]?.weight||"")}</td><td class="blank">${esc(s.actuals?.[e.index]?.[i]?.reps||"")}</td><td class="blank">${esc(s.actuals?.[e.index]?.[i]?.note||"")}</td></tr>`).join("")}</table>`})})}if(c)html+=`<h2>CONDITIONING + CORE</h2><p><b>Cardio:</b> ${esc(c.cardio)}</p><p><b>Core emphasis:</b> ${esc(c.emphasis)}</p><p style="white-space:pre-wrap">${esc(c.core)}</p><table><tr><th>Actual / Notes</th></tr><tr><td class="notes"></td></tr></table>`;html+=`<h2>WORKOUT NOTES</h2><table><tr><td class="notes">${esc(s.notes||"")}</td></tr><tr><td class="notes"></td></tr></table></div>`;document.querySelector("#printArea").innerHTML=html;window.print();setTimeout(()=>document.querySelector("#printArea").innerHTML="",500)}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`project-bane-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}async function importBackup(file){if(!file)return;try{const incoming=JSON.parse(await file.text());state={...DEFAULTS,...incoming};save();render();alert("Backup restored.")}catch{alert("Invalid Bane backup.")}}
async function boot(){try{if(!state.program)state.program=await fetch("./data/program.json").then(r=>r.json());if(!state.nutrition)state.nutrition=await fetch("./data/nutrition.json").then(r=>r.json())}catch(e){console.error(e)}render()}boot();
</script></body></html>
